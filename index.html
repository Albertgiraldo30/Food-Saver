<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Saver</title>
  <style>
    /* Estilos mínimos: el diseño completo es la capa 5 */
    body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 960px; padding: 16px; }
    form { display: grid; gap: 8px; max-width: 360px; margin-bottom: 24px; }
    label { display: grid; gap: 4px; }
    ul { padding-left: 20px; }
    li { margin: 4px 0; }
    .vacio { color: #666; font-style: italic; }
    li button { margin-left: 8px; }
    .proximo { color: #b45309; font-weight: 600; }
    .vencido { color: #b91c1c; }
    .receta { border: 1px solid #ccc; border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; }
    .receta h3 { margin: 4px 0; }
    .receta p { margin: 4px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Food Saver</h1>
    <p>Usa primero lo que está por vencer.</p>
  </header>

  <main>
    <section id="seccion-formulario">
      <h2>Agregar ingrediente</h2>
      <form id="form-ingrediente" novalidate>
        <label>Nombre
          <input id="campo-nombre" type="text" autocomplete="off">
        </label>
        <label>Cantidad
          <input id="campo-cantidad" type="text" inputmode="decimal" autocomplete="off">
        </label>
        <label>Unidad
          <select id="campo-unidad">
            <option value="">Selecciona</option>
          </select>
        </label>
        <label>Fecha de vencimiento
          <input id="campo-fecha" type="date">
        </label>
        <button type="submit" id="boton-enviar">Agregar</button>
        <button type="button" id="boton-cancelar" hidden>Cancelar</button>
      </form>
    </section>

    <section id="seccion-despensa">
      <h2>Despensa</h2>
      <ul id="lista-despensa"></ul>
    </section>

    <section id="seccion-vencidos">
      <h2>Vencidos</h2>
      <ul id="lista-vencidos"></ul>
    </section>

    <section id="seccion-recetas">
      <h2>Recetas sugeridas</h2>
      <div id="lista-recetas"></div>
    </section>
  </main>

  <script>
    /* ===================== 1. Constantes ===================== */

    // Unidad -> tipo y factor para llevarla a la unidad base del tipo (g, ml o unidades)
    const UNIDADES = {
      unidades:   { tipo: 'unidad',  factor: 1 },
      g:          { tipo: 'peso',    factor: 1 },
      kg:         { tipo: 'peso',    factor: 1000 },
      libras:     { tipo: 'peso',    factor: 500 },   // libra colombiana
      ml:         { tipo: 'volumen', factor: 1 },
      l:          { tipo: 'volumen', factor: 1000 },
      tazas:      { tipo: 'volumen', factor: 240 },
      cucharadas: { tipo: 'volumen', factor: 15 }
    };

    const CLAVE = 'foodsaver.v1'; // se usará en la capa 3 (persistencia)

    const RECETAS = [
      { id: 1, nombre: 'Huevos pericos',
        ingredientes: [
          { nombre: 'huevo', cantidad: 3, unidad: 'unidades' },
          { nombre: 'tomate', cantidad: 1, unidad: 'unidades' },
          { nombre: 'cebolla', cantidad: 1, unidad: 'unidades' },
          { nombre: 'aceite', cantidad: 15, unidad: 'ml' }
        ],
        preparacion: 'Picar tomate y cebolla, sofreír, agregar los huevos batidos y revolver.' },
      { id: 2, nombre: 'Arroz con pollo',
        ingredientes: [
          { nombre: 'arroz', cantidad: 250, unidad: 'g' },
          { nombre: 'pechuga de pollo', cantidad: 300, unidad: 'g' },
          { nombre: 'cebolla', cantidad: 1, unidad: 'unidades' },
          { nombre: 'zanahoria', cantidad: 1, unidad: 'unidades' }
        ],
        preparacion: 'Cocinar y desmechar el pollo, sofreír las verduras, agregar arroz y agua, cocinar 20 min.' },
      { id: 3, nombre: 'Pasta con salsa de tomate',
        ingredientes: [
          { nombre: 'pasta', cantidad: 250, unidad: 'g' },
          { nombre: 'tomate', cantidad: 3, unidad: 'unidades' },
          { nombre: 'cebolla', cantidad: 1, unidad: 'unidades' },
          { nombre: 'queso', cantidad: 100, unidad: 'g' }
        ],
        preparacion: 'Cocinar la pasta, hacer la salsa con tomate y cebolla, servir con queso.' },
      { id: 4, nombre: 'Ensalada de aguacate',
        ingredientes: [
          { nombre: 'aguacate', cantidad: 1, unidad: 'unidades' },
          { nombre: 'tomate', cantidad: 2, unidad: 'unidades' },
          { nombre: 'cebolla', cantidad: 1, unidad: 'unidades' },
          { nombre: 'limón', cantidad: 1, unidad: 'unidades' }
        ],
        preparacion: 'Picar todo, mezclar y aliñar con limón.' },
      { id: 5, nombre: 'Sopa de verduras',
        ingredientes: [
          { nombre: 'papa', cantidad: 3, unidad: 'unidades' },
          { nombre: 'zanahoria', cantidad: 2, unidad: 'unidades' },
          { nombre: 'cebolla', cantidad: 1, unidad: 'unidades' },
          { nombre: 'arveja', cantidad: 200, unidad: 'g' }
        ],
        preparacion: 'Picar y hervir 25 min en agua con sal.' },
      { id: 6, nombre: 'Batido de banano',
        ingredientes: [
          { nombre: 'banano', cantidad: 2, unidad: 'unidades' },
          { nombre: 'leche', cantidad: 500, unidad: 'ml' }
        ],
        preparacion: 'Licuar y servir frío.' },
      { id: 7, nombre: 'Arepa con queso',
        ingredientes: [
          { nombre: 'harina de maíz', cantidad: 250, unidad: 'g' },
          { nombre: 'queso', cantidad: 150, unidad: 'g' },
          { nombre: 'mantequilla', cantidad: 20, unidad: 'g' }
        ],
        preparacion: 'Amasar la harina con agua y sal, rellenar con queso y asar.' },
      { id: 8, nombre: 'Papas con huevo',
        ingredientes: [
          { nombre: 'papa', cantidad: 4, unidad: 'unidades' },
          { nombre: 'huevo', cantidad: 2, unidad: 'unidades' },
          { nombre: 'aceite', cantidad: 30, unidad: 'ml' }
        ],
        preparacion: 'Cocinar las papas en cubos, dorarlas y agregar los huevos.' }
    ];

    // Despensa de ejemplo (datos ficticios). "dias" es relativo a hoy.
    const SEMILLA = [
      { nombre: 'Queso',            cantidad: 200, unidad: 'g',        dias: -1 },
      { nombre: 'Tomate',           cantidad: 4,   unidad: 'unidades', dias: 1 },
      { nombre: 'Leche',            cantidad: 1,   unidad: 'l',        dias: 2 },
      { nombre: 'Pechuga de pollo', cantidad: 1,   unidad: 'libras',   dias: 2 },
      { nombre: 'Banano',           cantidad: 3,   unidad: 'unidades', dias: 3 },
      { nombre: 'Cebolla',          cantidad: 3,   unidad: 'unidades', dias: 7 },
      { nombre: 'Huevo',            cantidad: 12,  unidad: 'unidades', dias: 10 },
      { nombre: 'Papa',             cantidad: 6,   unidad: 'unidades', dias: 14 },
      { nombre: 'Pasta',            cantidad: 500, unidad: 'g',        dias: 90 },
      { nombre: 'Aceite',           cantidad: 1,   unidad: 'l',        dias: 120 },
      { nombre: 'Arroz',            cantidad: 1,   unidad: 'kg',       dias: 180 }
    ];

    /* ===================== 2. Utilidades puras ===================== */

    // Minúsculas, sin tildes, sin espacios sobrantes y sin la "s" final.
    function normalizar(texto) {
      return String(texto)
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim()
        .replace(/\s+/g, ' ')
        .replace(/s$/, '');
    }

    // Formas posibles de un nombre: quitando la "s" final (tomates -> tomate)
    // y quitando "es" final (limones -> limon).
    function formasNombre(texto) {
      const base = String(texto)
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim()
        .replace(/\s+/g, ' ');
      return [base.replace(/s$/, ''), base.replace(/es$/, '')];
    }

    // true si dos nombres son el mismo ingrediente ("Limones" = "limón", "Tomates" = "tomate").
    function mismoNombre(a, b) {
      const formasB = formasNombre(b);
      return formasNombre(a).some(f => formasB.includes(f));
    }

    function dosDigitos(n) { return String(n).padStart(2, '0'); }

    // Fecha local de hoy como 'YYYY-MM-DD' (no usa toISOString para evitar el corrimiento por UTC).
    function hoyISO() {
      const d = new Date();
      return d.getFullYear() + '-' + dosDigitos(d.getMonth() + 1) + '-' + dosDigitos(d.getDate());
    }

    // Suma n días a una fecha 'YYYY-MM-DD' y devuelve otra 'YYYY-MM-DD'.
    function sumarDias(iso, n) {
      const [a, m, d] = iso.split('-').map(Number);
      const f = new Date(a, m - 1, d + n);
      return f.getFullYear() + '-' + dosDigitos(f.getMonth() + 1) + '-' + dosDigitos(f.getDate());
    }

    // Días que faltan desde hoy hasta "vence" (negativo = ya venció).
    function diasPara(vence) {
      const [a1, m1, d1] = hoyISO().split('-').map(Number);
      const [a2, m2, d2] = vence.split('-').map(Number);
      return Math.round((Date.UTC(a2, m2 - 1, d2) - Date.UTC(a1, m1 - 1, d1)) / 86400000);
    }

    // Convierte una cantidad a la unidad base de su tipo: { tipo, valor }.
    function aBase(cantidad, unidad) {
      const u = UNIDADES[unidad];
      return { tipo: u.tipo, valor: cantidad * u.factor };
    }

    function nuevoId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function redondear(n) { return Math.round(n * 100) / 100; }

    // 'vencido' (antes de hoy), 'proximo' (0 a 5 días) o 'normal'.
    function estadoDe(ing) {
      const d = diasPara(ing.vence);
      if (d < 0) return 'vencido';
      if (d <= 5) return 'proximo';
      return 'normal';
    }

    // Texto legible del vencimiento según los días que faltan.
    function textoVence(dias) {
      if (dias < -1) return 'Venció hace ' + (-dias) + ' días';
      if (dias === -1) return 'Venció ayer';
      if (dias === 0) return 'Vence hoy';
      if (dias === 1) return 'Vence mañana';
      return 'Vence en ' + dias + ' días';
    }

    // Una fila sirve para las recetas solo si tiene unidad conocida, fecha y cantidad válidas
    // (hasta la capa 4 el formulario puede dejar pasar filas incompletas).
    function filaValida(ing) {
      return Boolean(UNIDADES[ing.unidad]) &&
        /^\d{4}-\d{2}-\d{2}$/.test(ing.vence) &&
        Number.isFinite(ing.cantidad) && ing.cantidad > 0;
    }

    /* ===================== 3. Almacenamiento ===================== */
    // Capa 3: cargar() y guardar() con localStorage. Por ahora el estado vive solo en memoria.

    /* ===================== 4. Recetas ===================== */

    // Compara una receta con la despensa. Para cada ingrediente de la receta suma
    // (convertidas) todas las filas NO vencidas del mismo nombre y tipo de unidad.
    function evaluarReceta(receta, lista) {
      const disponibles = [];
      const faltantes = [];
      let presentes = 0;
      let diasUrgente = Infinity;
      let urgente = null;

      for (const req of receta.ingredientes) {
        const pedido = aBase(req.cantidad, req.unidad);
        const filas = lista.filter(ing => filaValida(ing) && mismoNombre(ing.nombre, req.nombre));
        const noVencidas = filas.filter(ing => diasPara(ing.vence) >= 0);
        const compatibles = noVencidas.filter(ing => UNIDADES[ing.unidad].tipo === pedido.tipo);

        if (compatibles.length === 0) {
          let motivo = 'no está';
          if (filas.length > 0 && noVencidas.length === 0) motivo = 'vencido';
          else if (noVencidas.length > 0) motivo = 'unidad no compatible';
          faltantes.push({ nombre: req.nombre, motivo });
          continue;
        }

        // Presente: cuenta para mostrar la receta y para su urgencia aunque no alcance.
        presentes++;
        const diasMin = Math.min(...compatibles.map(ing => diasPara(ing.vence)));
        if (diasMin < diasUrgente) { diasUrgente = diasMin; urgente = req.nombre; }

        const total = compatibles.reduce((suma, ing) => suma + aBase(ing.cantidad, ing.unidad).valor, 0);
        if (total + 1e-9 >= pedido.valor) disponibles.push({ nombre: req.nombre });
        else faltantes.push({ nombre: req.nombre, motivo: 'no alcanza' });
      }

      return { receta, disponibles, faltantes, presentes, diasUrgente, urgente,
               usaProximo: diasUrgente <= 5 };
    }

    // Recetas con al menos 1 ingrediente presente, ordenadas por: usa algún próximo a vencer,
    // menos días del más urgente (solo entre las que usan próximos), menos faltantes, orden original.
    function sugerirRecetas(lista) {
      return RECETAS
        .map(r => evaluarReceta(r, lista))
        .filter(ev => ev.presentes > 0)
        .sort((a, b) => {
          if (a.usaProximo !== b.usaProximo) return a.usaProximo ? -1 : 1;
          if (a.usaProximo && a.diasUrgente !== b.diasUrgente) return a.diasUrgente - b.diasUrgente;
          if (a.faltantes.length !== b.faltantes.length) return a.faltantes.length - b.faltantes.length;
          return a.receta.id - b.receta.id;
        });
    }

    /* ===================== 5. Validación ===================== */
    // Capa 4: validar().

    /* ===================== Estado ===================== */

    let despensa = SEMILLA.map(s => ({
      id: nuevoId(),
      nombre: s.nombre,
      cantidad: s.cantidad,
      unidad: s.unidad,
      vence: sumarDias(hoyISO(), s.dias)
    }));

    /* ===================== 6. Render ===================== */

    const listaDespensa = document.getElementById('lista-despensa');
    const listaVencidos = document.getElementById('lista-vencidos');
    const listaRecetas = document.getElementById('lista-recetas');

    function ordenarPorVencimiento(lista) {
      return [...lista].sort((a, b) =>
        a.vence.localeCompare(b.vence) || a.nombre.localeCompare(b.nombre, 'es'));
    }

    function crearTexto(etiqueta, texto, clase) {
      const el = document.createElement(etiqueta);
      el.textContent = texto;
      if (clase) el.className = clase;
      return el;
    }

    function crearBoton(texto, accion, id) {
      const b = crearTexto('button', texto);
      b.type = 'button';
      b.dataset.accion = accion;
      b.dataset.id = id;
      return b;
    }

    // Fila de ingrediente con sus botones Editar y Eliminar.
    function crearFila(ing) {
      const estado = estadoDe(ing);
      const li = document.createElement('li');
      if (estado !== 'normal') li.className = estado;
      const dias = diasPara(ing.vence);
      const vence = Number.isFinite(dias) ? textoVence(dias) + ' (' + ing.vence + ')' : 'sin fecha';
      li.appendChild(crearTexto('span', ing.nombre + ' — ' + ing.cantidad + ' ' + ing.unidad + ' — ' + vence));
      li.appendChild(crearBoton('Editar', 'editar', ing.id));
      li.appendChild(crearBoton('Eliminar', 'eliminar', ing.id));
      return li;
    }

    function pintarLista(contenedor, filas, textoVacio) {
      contenedor.replaceChildren();
      if (filas.length === 0) {
        contenedor.appendChild(crearTexto('li', textoVacio, 'vacio'));
        return;
      }
      for (const ing of filas) contenedor.appendChild(crearFila(ing));
    }

    function pintarRecetas() {
      listaRecetas.replaceChildren();
      const sugeridas = sugerirRecetas(despensa);
      if (sugeridas.length === 0) {
        listaRecetas.appendChild(crearTexto('p', 'No hay recetas con tus ingredientes disponibles.', 'vacio'));
        return;
      }
      for (const ev of sugeridas) {
        const tarjeta = document.createElement('article');
        tarjeta.className = 'receta';
        tarjeta.appendChild(crearTexto('h3', ev.receta.nombre));
        if (ev.usaProximo) {
          tarjeta.appendChild(crearTexto('p',
            'Aprovecha: ' + ev.urgente + ' (' + textoVence(ev.diasUrgente).toLowerCase() + ')', 'proximo'));
        }
        const tienes = ev.disponibles.map(d => d.nombre).join(', ') || 'ninguno completo';
        tarjeta.appendChild(crearTexto('p', 'Tienes: ' + tienes));
        const falta = ev.faltantes.map(f => f.nombre + ' (' + f.motivo + ')').join(', ') || 'nada';
        tarjeta.appendChild(crearTexto('p', 'Te falta: ' + falta));
        tarjeta.appendChild(crearTexto('p', 'Preparación: ' + ev.receta.preparacion));
        listaRecetas.appendChild(tarjeta);
      }
    }

    function render() {
      const ordenada = ordenarPorVencimiento(despensa);
      pintarLista(listaDespensa, ordenada.filter(ing => estadoDe(ing) !== 'vencido'), 'No hay ingredientes.');
      pintarLista(listaVencidos, ordenada.filter(ing => estadoDe(ing) === 'vencido'), 'No hay ingredientes vencidos.');
      pintarRecetas();
    }

    /* ===================== 7. Eventos ===================== */

    const form = document.getElementById('form-ingrediente');
    const campoNombre = document.getElementById('campo-nombre');
    const campoCantidad = document.getElementById('campo-cantidad');
    const campoUnidad = document.getElementById('campo-unidad');
    const campoFecha = document.getElementById('campo-fecha');
    const botonEnviar = document.getElementById('boton-enviar');
    const botonCancelar = document.getElementById('boton-cancelar');

    let editandoId = null; // id del ingrediente que se está editando, o null si se está agregando

    // Al agregar: si existe uno con el mismo nombre, tipo de unidad y MISMA fecha, suma la cantidad
    // convertida a la unidad existente. Si no, crea una fila nueva.
    function agregarIngrediente(nuevo) {
      // Solo se fusiona si la fila nueva es válida, para no dañar una fila existente con NaN o negativos.
      const existente = filaValida(nuevo) && despensa.find(ing =>
        filaValida(ing) &&
        mismoNombre(ing.nombre, nuevo.nombre) &&
        UNIDADES[ing.unidad].tipo === UNIDADES[nuevo.unidad].tipo &&
        ing.vence === nuevo.vence);
      if (existente) {
        const sumado = nuevo.cantidad * UNIDADES[nuevo.unidad].factor / UNIDADES[existente.unidad].factor;
        existente.cantidad = redondear(existente.cantidad + sumado);
      } else {
        despensa.push({ id: nuevoId(), ...nuevo });
      }
    }

    function salirDeEdicion() {
      editandoId = null;
      botonEnviar.textContent = 'Agregar';
      botonCancelar.hidden = true;
      form.reset();
    }

    form.addEventListener('submit', evento => {
      evento.preventDefault();
      // Sin validación todavía (capa 4).
      const datos = {
        nombre: campoNombre.value.trim(),
        cantidad: redondear(Number(campoCantidad.value)),
        unidad: campoUnidad.value,
        vence: campoFecha.value
      };
      if (editandoId) {
        // Al editar nunca se fusiona.
        const ing = despensa.find(i => i.id === editandoId);
        if (ing) Object.assign(ing, datos);
      } else {
        agregarIngrediente(datos);
      }
      salirDeEdicion();
      render();
      campoNombre.focus();
    });

    botonCancelar.addEventListener('click', () => {
      salirDeEdicion();
      campoNombre.focus();
    });

    // Botones Editar / Eliminar de las listas (delegación de eventos).
    function alHacerClicEnLista(evento) {
      const boton = evento.target.closest('button[data-accion]');
      if (!boton) return;
      const ing = despensa.find(i => i.id === boton.dataset.id);
      if (!ing) return;

      if (boton.dataset.accion === 'eliminar') {
        despensa = despensa.filter(i => i.id !== ing.id);
        if (editandoId === ing.id) salirDeEdicion();
        render();
      } else if (boton.dataset.accion === 'editar') {
        editandoId = ing.id;
        campoNombre.value = ing.nombre;
        campoCantidad.value = ing.cantidad;
        campoUnidad.value = ing.unidad;
        campoFecha.value = ing.vence;
        botonEnviar.textContent = 'Guardar cambios';
        botonCancelar.hidden = false;
        campoNombre.focus();
      }
    }
    listaDespensa.addEventListener('click', alHacerClicEnLista);
    listaVencidos.addEventListener('click', alHacerClicEnLista);

    /* ===================== 8. Inicio ===================== */

    for (const unidad of Object.keys(UNIDADES)) {
      const opcion = document.createElement('option');
      opcion.value = unidad;
      opcion.textContent = unidad;
      campoUnidad.appendChild(opcion);
    }

    render();
  </script>
</body>
</html>
