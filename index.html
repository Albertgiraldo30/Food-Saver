<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Saver</title>
  <style>
    /* ===================== Diseño (capa 5) ===================== */
    :root {
      --fondo: #f4f6f1;
      --panel: #ffffff;
      --borde: #d6dccf;
      --texto: #1f2a1f;
      --suave: #5b665b;
      --verde: #2f7d32;
      --verde-oscuro: #22602a;
      --verde-claro: #e6f2e4;
      --naranja: #a85400;
      --naranja-claro: #fdf0dc;
      --rojo: #b3261e;
      --rojo-claro: #fbe7e5;
      --radio: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 17px;
      line-height: 1.45;
      color: var(--texto);
      background: var(--fondo);
    }

    /* Encabezado */
    .encabezado { background: var(--verde); color: #fff; padding: 18px 0; }
    .encabezado-contenido { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
    .encabezado h1 { margin: 0; font-size: 1.8rem; }
    .encabezado p { margin: 4px 0 0; opacity: 0.95; }
    .aviso {
      max-width: 1200px; margin: 12px max(16px, calc((100% - 1200px) / 2)) 0; padding: 10px 14px;
      background: var(--naranja-claro); color: var(--texto);
      border: 1px solid var(--naranja); border-radius: var(--radio);
    }

    /* Tablero: una columna en celular, dos en escritorio */
    .tablero {
      max-width: 1200px; margin: 0 auto; padding: 16px;
      display: grid; gap: 16px; grid-template-columns: 1fr;
    }
    @media (min-width: 900px) {
      .tablero { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
    }
    .columna { display: grid; gap: 16px; min-width: 0; }
    .panel {
      background: var(--panel); border: 1px solid var(--borde);
      border-radius: var(--radio); padding: 16px; min-width: 0;
    }
    .panel h2 { margin: 0 0 12px; font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
    .contador { min-height: 1.4em; line-height: 1.4em;
      font-size: 0.85rem; font-weight: 600; background: var(--fondo);
      border: 1px solid var(--borde); border-radius: 999px; padding: 0 10px;
    }

    /* Formulario */
    .formulario { display: grid; gap: 12px; }
    .fila-campos { display: grid; gap: 12px; grid-template-columns: 1fr; }
    @media (min-width: 520px) { .fila-campos { grid-template-columns: 1fr 1fr; } }
    .campo { display: grid; gap: 4px; min-width: 0; }
    .campo label { font-weight: 600; }
    .campo input, .campo select {
      width: 100%; font: inherit; padding: 8px 10px;
      border: 1px solid #7d8a79; border-radius: 8px; background: #fff; color: var(--texto);
    }
    .campo input:focus, .campo select:focus { outline: 3px solid var(--verde); outline-offset: 1px; }
    .invalido { border: 2px solid var(--rojo) !important; background: var(--rojo-claro) !important; }
    .error { color: var(--rojo); font-size: 0.9rem; min-height: 1.2em; }
    .acciones-form { display: flex; gap: 8px; flex-wrap: wrap; }

    /* Botones */
    button { font: inherit; cursor: pointer; border-radius: 8px; }
    .boton { padding: 9px 18px; border: 1px solid var(--verde); background: var(--verde); color: #fff; font-weight: 600; }
    .boton:hover { background: var(--verde-oscuro); }
    .boton-secundario { padding: 9px 18px; border: 1px solid #a9b3a5; background: #fff; color: var(--texto); }
    .boton-chico { padding: 4px 10px; font-size: 0.9rem; border: 1px solid #a9b3a5; background: #fff; color: var(--texto); }
    .boton-chico:hover, .boton-secundario:hover { background: var(--fondo); }
    .boton-peligro { color: var(--rojo); border-color: #e2a9a4; }
    button:focus-visible { outline: 3px solid var(--verde); outline-offset: 2px; }

    /* Listas de ingredientes */
    .lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .ingrediente {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
      padding: 10px 12px; border: 1px solid var(--borde); border-left: 6px solid var(--borde);
      border-radius: 8px; background: #fff;
    }
    .ingrediente.proximo { border-left-color: var(--naranja); background: var(--naranja-claro); }
    .ingrediente.vencido { border-left-color: var(--rojo); background: var(--rojo-claro); }
    .ingrediente.ok { border-left-color: var(--verde); background: var(--verde-claro); }
    .ingrediente.editando { outline: 3px solid var(--verde); outline-offset: 2px; }
    .info { flex: 1 1 220px; min-width: 0; }
    .nombre { font-weight: 700; overflow-wrap: anywhere; }
    .detalle { color: var(--suave); font-size: 0.95rem; }
    .acciones { display: flex; gap: 6px; }
    .etiqueta {
      display: inline-block; font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.03em; padding: 1px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle;
    }
    .etiqueta.proximo { background: var(--naranja); color: #fff; }
    .etiqueta.vencido { background: var(--rojo); color: #fff; }
    .etiqueta.ok { background: var(--verde); color: #fff; }
    .vacio { color: var(--suave); font-style: italic; }

    /* Tarjetas de recetas */
    .recetas { display: grid; gap: 12px; }
    .receta { border: 1px solid var(--borde); border-radius: var(--radio); padding: 14px; background: #fff; }
    .receta.urgente { border-left: 6px solid var(--naranja); }
    .receta h3 { margin: 0 0 6px; font-size: 1.15rem; }
    .receta p { margin: 6px 0 0; }
    .aprovecha {
      display: inline-block; background: var(--naranja-claro); color: var(--naranja);
      font-weight: 700; padding: 2px 10px; border-radius: 999px;
    }
    .rotulo { font-weight: 700; }
    .usa .rotulo { color: var(--verde); }
    .falta .rotulo { color: var(--rojo); }
    .falta.nada .rotulo { color: var(--verde); }
    .preparacion { color: var(--suave); }

    /* Resumen de arriba (ocupa todo el ancho del tablero) */
    .resumen { grid-column: 1 / -1; display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .tarjeta-resumen {
      display: flex; flex-direction: column; gap: 2px; padding: 12px 14px;
      border-radius: var(--radio); border: 1px solid var(--borde); border-left: 6px solid var(--borde); background: #fff;
    }
    .tarjeta-resumen .cifra { font-size: 1.9rem; font-weight: 800; line-height: 1.1; }
    .tarjeta-resumen.pronto { border-left-color: var(--naranja); background: var(--naranja-claro); }
    .tarjeta-resumen.pronto .cifra { color: var(--naranja); }
    .tarjeta-resumen.vencidos { border-left-color: var(--rojo); background: var(--rojo-claro); }
    .tarjeta-resumen.vencidos .cifra { color: var(--rojo); }
    .tarjeta-resumen.recetas { border-left-color: var(--verde); background: var(--verde-claro); }
    .tarjeta-resumen.recetas .cifra { color: var(--verde); }
    @media (max-width: 520px) { .tarjeta-resumen { padding: 10px; font-size: 0.85rem; } .tarjeta-resumen .cifra { font-size: 1.5rem; } }

    /* Aviso breve "Guardado" junto al botón */
    .acciones-form { align-items: center; }
    /* Notificaciones (toasts): esquina superior derecha, desaparecen a los 3 s */
    .toasts {
      position: fixed; top: 16px; right: 16px; z-index: 30;
      display: flex; flex-direction: column; gap: 8px; width: min(360px, calc(100vw - 32px)); pointer-events: none;
    }
    .toast {
      padding: 10px 14px; border-radius: 8px; color: #fff; font-weight: 600;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2); overflow-wrap: anywhere;
    }
    .toast-exito { background: var(--verde); }
    .toast-info { background: #4b5563; }
    .toast-error { background: var(--rojo); }

    /* Confirmación en la página */
    .pie-panel { margin-top: 12px; display: flex; justify-content: flex-end; }
    .confirmacion {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45);
      display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10;
    }
    .confirmacion[hidden] { display: none; }
    .caja-confirmacion {
      background: #fff; border-radius: var(--radio); padding: 20px; max-width: 420px; width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }
    .caja-confirmacion p { margin: 0 0 16px; font-weight: 600; }
    .confirmacion.encima { z-index: 20; }
    .caja-modal { max-width: 540px; max-height: calc(100vh - 32px); overflow-y: auto; }
    .cabecera-modal { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .cabecera-modal h2 { margin: 0; font-size: 1.25rem; }
    .boton-cerrar { border: 1px solid #a9b3a5; background: #fff; width: 36px; height: 36px; font-size: 1.4rem; line-height: 1; padding: 0; }
    .boton-cerrar:hover { background: var(--fondo); }

    /* ===================== Acabado: transiciones (150-250 ms) y hover ===================== */
    @keyframes aparecer { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes resaltar { from { box-shadow: 0 0 0 4px rgba(47, 125, 50, 0.6); } to { box-shadow: 0 0 0 0 rgba(47, 125, 50, 0); } }
    @keyframes fondoModal { from { opacity: 0; } to { opacity: 1; } }
    @keyframes tarjetaModal { from { opacity: 0; transform: translateY(8px) scale(0.97); } to { opacity: 1; transform: none; } }
    @keyframes entrarToast { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }

    .aparece { animation: aparecer 200ms ease-out; }
    .resaltado { animation: aparecer 200ms ease-out, resaltar 1200ms ease-out 200ms; }
    .confirmacion:not([hidden]) { animation: fondoModal 200ms ease-out; }
    .confirmacion:not([hidden]) .caja-confirmacion { animation: tarjetaModal 200ms ease-out; }
    .toast { animation: entrarToast 200ms ease-out; transition: opacity 200ms ease-in, transform 200ms ease-in; }
    .toast.saliendo { opacity: 0; transform: translateX(16px); }

    button { transition: background-color 150ms, border-color 150ms, box-shadow 150ms, transform 150ms; }
    button:active { transform: scale(0.97); }
    .boton:hover { box-shadow: 0 2px 8px rgba(47, 125, 50, 0.35); }
    .boton-peligro:hover { background: var(--rojo-claro); border-color: var(--rojo); }
    .ingrediente, .receta, .tarjeta-resumen { transition: box-shadow 200ms, transform 200ms; }
    .ingrediente:hover, .receta:hover, .tarjeta-resumen:hover { box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1); transform: translateY(-1px); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }
    }

    /* Oculto visualmente pero legible por lectores de pantalla */
    .solo-lector { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
  <!-- Notificaciones (toasts) -->
  <div id="toasts" class="toasts"></div>

  <header class="encabezado">
    <div class="encabezado-contenido">
      <h1>Food Saver</h1>
      <p>Usa primero lo que está por vencer.</p>
    </div>
    <p id="aviso" class="aviso" role="status" hidden></p>
  </header>

  <!-- Confirmación dentro de la página (sin ventanas emergentes del navegador). -->
  <div id="confirmacion" class="confirmacion encima" role="alertdialog" aria-modal="true" aria-labelledby="texto-confirmacion" hidden>
    <div class="caja-confirmacion">
      <p id="texto-confirmacion"></p>
      <div class="acciones-form">
        <button type="button" id="boton-confirmar-si" class="boton"></button>
        <button type="button" id="boton-confirmar-no" class="boton-secundario">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Modal de edición: overlay oscuro + tarjeta centrada. Mismas validaciones que Agregar. -->
  <div id="modal-editar" class="confirmacion" role="dialog" aria-modal="true" aria-labelledby="titulo-editar" hidden>
    <div class="caja-confirmacion caja-modal">
      <div class="cabecera-modal">
        <h2 id="titulo-editar">Editar ingrediente</h2>
        <button type="button" id="editar-cerrar" class="boton-cerrar" aria-label="Cerrar">&times;</button>
      </div>
      <form id="form-editar" class="formulario" novalidate>
            <div class="campo">
              <label for="editar-nombre">Nombre</label>
              <input id="editar-nombre" type="text" autocomplete="off" aria-describedby="error-editar-nombre">
              <span class="error" id="error-editar-nombre" aria-live="polite"></span>
            </div>
          <div class="fila-campos">
            <div class="campo">
              <label for="editar-cantidad">Cantidad</label>
              <input id="editar-cantidad" type="text" inputmode="decimal" autocomplete="off" aria-describedby="error-editar-cantidad">
              <span class="error" id="error-editar-cantidad" aria-live="polite"></span>
            </div>
            <div class="campo">
              <label for="editar-unidad">Unidad</label>
              <select id="editar-unidad" aria-describedby="error-editar-unidad"><option value="">Selecciona</option></select>
              <span class="error" id="error-editar-unidad" aria-live="polite"></span>
            </div>
          </div>
            <div class="campo">
              <label for="editar-fecha">Fecha de vencimiento</label>
              <input id="editar-fecha" type="date" aria-describedby="error-editar-fecha">
              <span class="error" id="error-editar-fecha" aria-live="polite"></span>
            </div>
          <div class="acciones-form">
            <button type="submit" id="editar-guardar" class="boton">Guardar</button>
            <button type="button" id="editar-cancelar" class="boton-secundario">Cancelar</button>
          </div>
        </form>
      </div>
  </div>

  <main class="tablero">
    <section class="resumen" aria-label="Resumen">
      <div class="tarjeta-resumen pronto"><span class="cifra" id="resumen-pronto">0</span><span>Vencen pronto (3 días o menos)</span></div>
      <div class="tarjeta-resumen vencidos"><span class="cifra" id="resumen-vencidos">0</span><span>Vencidos</span></div>
      <div class="tarjeta-resumen recetas"><span class="cifra" id="resumen-recetas">0</span><span>Recetas posibles</span></div>
    </section>

    <div class="columna">
      <section class="panel" id="seccion-formulario" aria-labelledby="titulo-formulario">
        <h2 id="titulo-formulario">Agregar ingrediente</h2>
        <form id="form-ingrediente" class="formulario" novalidate>
          <!-- El mensaje de error va FUERA del label para que el lector de pantalla no lo lea dos veces. -->
          <div class="campo">
            <label for="campo-nombre">Nombre</label>
            <input id="campo-nombre" type="text" autocomplete="off" aria-describedby="error-campo-nombre">
            <span class="error" id="error-campo-nombre" aria-live="polite"></span>
          </div>
          <div class="fila-campos">
            <div class="campo">
              <label for="campo-cantidad">Cantidad</label>
              <input id="campo-cantidad" type="text" inputmode="decimal" autocomplete="off" aria-describedby="error-campo-cantidad">
              <span class="error" id="error-campo-cantidad" aria-live="polite"></span>
            </div>
            <div class="campo">
              <label for="campo-unidad">Unidad</label>
              <select id="campo-unidad" aria-describedby="error-campo-unidad">
                <option value="">Selecciona</option>
              </select>
              <span class="error" id="error-campo-unidad" aria-live="polite"></span>
            </div>
          </div>
          <div class="campo">
            <label for="campo-fecha">Fecha de vencimiento</label>
            <input id="campo-fecha" type="date" aria-describedby="error-campo-fecha">
            <span class="error" id="error-campo-fecha" aria-live="polite"></span>
          </div>
          <div class="acciones-form">
            <button type="submit" id="boton-enviar" class="boton">Agregar</button>
          </div>
        </form>
      </section>

      <section class="panel" id="seccion-despensa" aria-labelledby="titulo-despensa">
        <h2 id="titulo-despensa">Despensa <span class="contador" id="contador-despensa"></span></h2>
        <ul class="lista" id="lista-despensa"></ul>
        <div class="pie-panel">
          <button type="button" id="boton-restaurar" class="boton-secundario">Restaurar datos de ejemplo</button>
        </div>
      </section>

      <section class="panel" id="seccion-vencidos" aria-labelledby="titulo-vencidos">
        <h2 id="titulo-vencidos">Vencidos <span class="contador" id="contador-vencidos"></span></h2>
        <ul class="lista" id="lista-vencidos"></ul>
      </section>
    </div>

    <section class="panel" id="seccion-recetas" aria-labelledby="titulo-recetas">
      <h2 id="titulo-recetas">Recetas sugeridas <span class="contador" id="contador-recetas"></span></h2>
      <div class="recetas" id="lista-recetas"></div>
    </section>
  </main>

  <!-- Lógica pura (constantes, nombres, fechas, conversiones, validaciones, recetas). Probada con: node pruebas.js -->
  <script src="logica.js"></script>
  <script>
    /* ===================== Estado y persistencia ===================== */

    let despensa = [];
    let recetas = RECETAS;
    const aviso = document.getElementById('aviso');

    function mostrarAviso(texto) {
      aviso.textContent = texto;
      aviso.hidden = false;
    }

    // Guarda despensa y recetas en localStorage. Si no se puede, avisa en pantalla.
    function guardar() {
      try {
        localStorage.setItem(CLAVE, serializar(despensa, recetas));
        return true;
      } catch (e) {
        mostrarAviso('No se pudieron guardar los cambios en este navegador. Se perderán al recargar.');
        return false;
      }
    }

    // Lee localStorage. Sin datos: despensa de ejemplo (y se guarda). Datos dañados: ejemplo + aviso.
    function cargar() {
      let texto = null;
      try {
        texto = localStorage.getItem(CLAVE);
      } catch (e) {
        mostrarAviso('Este navegador no permite guardar datos. Los cambios se perderán al recargar.');
        despensa = crearSemilla();
        return;
      }
      if (texto === null) {
        despensa = crearSemilla();
        guardar();
        return;
      }
      const datos = deserializar(texto);
      if (!datos) {
        mostrarAviso('Los datos guardados estaban dañados. Se cargó la despensa de ejemplo.');
        despensa = crearSemilla();
        guardar();
        return;
      }
      despensa = datos.ingredientes;
      recetas = datos.recetas;
      if (datos.descartados > 0) {
        mostrarAviso('Se descartaron ' + datos.descartados + ' ingrediente(s) guardados con datos inválidos.');
        guardar();
      }
    }

    /* ===================== Render ===================== */

    const listaDespensa = document.getElementById('lista-despensa');
    const listaVencidos = document.getElementById('lista-vencidos');
    const listaRecetas = document.getElementById('lista-recetas');

    function crearTexto(etiqueta, texto, clase) {
      const el = document.createElement(etiqueta);
      el.textContent = texto;
      if (clase) el.className = clase;
      return el;
    }

    function crearBoton(texto, accion, ing, clase) {
      const b = crearTexto('button', texto, clase);
      b.type = 'button';
      b.dataset.accion = accion;
      b.dataset.id = ing.id;
      b.setAttribute('aria-label', texto + ' ' + ing.nombre);
      return b;
    }

    // Párrafo con un rótulo en negrita ("Usa:") y su texto.
    function crearRenglon(clase, rotulo, texto) {
      const p = document.createElement('p');
      p.className = clase;
      p.appendChild(crearTexto('span', rotulo + ' ', 'rotulo'));
      p.appendChild(document.createTextNode(texto));
      return p;
    }

    // Para animar solo lo nuevo (y no todo en cada cambio) y resaltar lo recién agregado o editado.
    let idsAnteriores = null;      // ids de ingredientes del render anterior (null = primera vez)
    let recetasAnteriores = null;  // ids de recetas sugeridas del render anterior
    let resaltarId = null;         // id del ingrediente a resaltar en el próximo render

    // Fila de ingrediente: nombre + etiqueta de estado (texto, no solo color), detalle y botones.
    function crearFila(ing) {
      const estado = estadoDe(ing);
      const li = document.createElement('li');
      // Colores: vencido (rojo), próximo 0 a 3 días (naranja), ok (verde); siempre con etiqueta de texto.
      const clase = estado === 'normal' ? 'ok' : estado;
      li.className = 'ingrediente ' + clase + (ing.id === editandoId ? ' editando' : '');
      li.dataset.id = ing.id;
      if (ing.id === resaltarId) li.classList.add('resaltado');
      else if (!idsAnteriores || !idsAnteriores.has(ing.id)) li.classList.add('aparece');

      const info = document.createElement('div');
      info.className = 'info';
      const nombre = crearTexto('div', ing.nombre, 'nombre');
      if (estado === 'proximo') nombre.appendChild(crearTexto('span', 'Próximo', 'etiqueta proximo'));
      if (estado === 'vencido') nombre.appendChild(crearTexto('span', 'Vencido', 'etiqueta vencido'));
      if (estado === 'normal') nombre.appendChild(crearTexto('span', 'OK', 'etiqueta ok'));
      info.appendChild(nombre);
      const dias = diasPara(ing.vence);
      const vence = Number.isFinite(dias) ? textoVence(dias) + ' · ' + formatoFecha(ing.vence) : 'sin fecha';
      info.appendChild(crearTexto('div', formatoCantidad(ing.cantidad, ing.unidad) + ' · ' + vence, 'detalle'));
      li.appendChild(info);

      const acciones = document.createElement('div');
      acciones.className = 'acciones';
      acciones.appendChild(crearBoton('Editar', 'editar', ing, 'boton-chico'));
      acciones.appendChild(crearBoton('Eliminar', 'eliminar', ing, 'boton-chico boton-peligro'));
      li.appendChild(acciones);
      return li;
    }

    function pintarLista(contenedor, contador, filas, textoVacio) {
      contenedor.replaceChildren();
      contador.textContent = filas.length;
      if (filas.length === 0) {
        contenedor.appendChild(crearTexto('li', textoVacio, 'vacio'));
        return;
      }
      for (const ing of filas) contenedor.appendChild(crearFila(ing));
    }

    function pintarRecetas() {
      listaRecetas.replaceChildren();
      const sugeridas = sugerirRecetas(despensa, recetas);
      document.getElementById('contador-recetas').textContent = sugeridas.length;
      if (sugeridas.length === 0) {
        listaRecetas.appendChild(crearTexto('p', 'No hay recetas con tus ingredientes disponibles.', 'vacio'));
        return;
      }
      for (const ev of sugeridas) {
        const tarjeta = document.createElement('article');
        tarjeta.className = 'receta' + (ev.usaProximo ? ' urgente' : '');
        if (!recetasAnteriores || !recetasAnteriores.has(ev.receta.id)) tarjeta.classList.add('aparece');
        tarjeta.appendChild(crearTexto('h3', ev.receta.nombre));
        if (ev.usaProximo) {
          const p = document.createElement('p');
          p.appendChild(crearTexto('span',
            'Aprovecha: ' + ev.urgente + ' (' + textoVence(ev.diasUrgente).toLowerCase() + ')', 'aprovecha'));
          tarjeta.appendChild(p);
        }
        // "Usa": en el orden de la receta; los que no alcanzan se muestran como "tomate 1 de 3 unidades".
        const usa = ev.receta.ingredientes.map(req => {
          const d = ev.disponibles.find(x => x.nombre === req.nombre);
          if (d) return d.nombre + ' ' + formatoCantidad(d.cantidad, d.unidad);
          const p = ev.parciales.find(x => x.nombre === req.nombre);
          if (p) return p.nombre + ' ' + p.tiene + ' de ' + formatoCantidad(p.pide, p.unidad);
          return null;
        }).filter(Boolean).join(', ');
        tarjeta.appendChild(crearRenglon('usa', 'Usa:', usa));
        const falta = ev.faltantes.map(f => f.nombre + ' (' + f.motivo + ')').join(', ');
        tarjeta.appendChild(crearRenglon(falta ? 'falta' : 'falta nada', 'Te falta:', falta || 'nada'));
        tarjeta.appendChild(crearRenglon('preparacion', 'Preparación:', ev.receta.preparacion));
        listaRecetas.appendChild(tarjeta);
      }
    }

    function render() {
      const { vigentes, vencidos } = separarVencidos(despensa);
      pintarLista(listaDespensa, document.getElementById('contador-despensa'), vigentes, 'No hay ingredientes.');
      pintarLista(listaVencidos, document.getElementById('contador-vencidos'), vencidos, 'No hay ingredientes vencidos.');
      pintarRecetas();
      const r = resumen(despensa, recetas);
      document.getElementById('resumen-pronto').textContent = r.pronto;
      document.getElementById('resumen-vencidos').textContent = r.vencidos;
      document.getElementById('resumen-recetas').textContent = r.recetas;

      // Lleva a la vista la fila resaltada (recién agregada o editada).
      const resaltada = resaltarId && document.querySelector('.ingrediente[data-id="' + resaltarId + '"]');
      if (resaltada) {
        const reducir = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        resaltada.scrollIntoView({ block: 'nearest', behavior: reducir ? 'auto' : 'smooth' });
      }
      idsAnteriores = new Set(despensa.map(i => i.id));
      recetasAnteriores = new Set(sugerirRecetas(despensa, recetas).map(ev => ev.receta.id));
      resaltarId = null;
    }

    /* ===================== Formularios (agregar y editar) ===================== */

    // Controla un formulario con los campos nombre, cantidad, unidad y fecha cuyos ids empiezan
    // con "prefijo" (campo-… o editar-…). Lo usan el formulario de Agregar y el modal de Editar,
    // así ambos tienen las mismas validaciones y los mismos mensajes bajo cada campo.
    function crearControlFormulario(prefijo) {
      const campos = ['nombre', 'cantidad', 'unidad', 'fecha'].map(clave => ({
        clave,
        campo: document.getElementById(prefijo + '-' + clave),
        error: document.getElementById('error-' + prefijo + '-' + clave)
      }));
      const porClave = Object.fromEntries(campos.map(c => [c.clave, c.campo]));

      function limpiarError(c) {
        c.error.textContent = '';
        c.campo.classList.remove('invalido');
        c.campo.removeAttribute('aria-invalid');
      }
      // Al corregir un campo se borra su error.
      for (const c of campos) {
        c.campo.addEventListener('input', () => limpiarError(c));
        c.campo.addEventListener('change', () => limpiarError(c));
      }

      return {
        campos: porClave,
        leer: () => ({
          nombre: porClave.nombre.value,
          cantidad: porClave.cantidad.value,
          unidad: porClave.unidad.value,
          vence: porClave.fecha.value
        }),
        llenar: ing => {
          porClave.nombre.value = ing.nombre;
          porClave.cantidad.value = ing.cantidad;
          porClave.unidad.value = ing.unidad;
          porClave.fecha.value = ing.vence;
        },
        limpiarErrores: () => campos.forEach(limpiarError),
        // Muestra cada error bajo su campo y pone el foco en el primero.
        mostrarErrores: errores => {
          let primero = null;
          for (const c of campos) {
            limpiarError(c);
            if (errores[c.clave]) {
              c.error.textContent = errores[c.clave];
              c.campo.classList.add('invalido');
              c.campo.setAttribute('aria-invalid', 'true');
              if (!primero) primero = c.campo;
            }
          }
          if (primero) primero.focus();
        }
      };
    }

    // Llena un selector con las unidades: valor interno + nombre completo visible.
    function llenarSelectorUnidades(select) {
      for (const unidad of Object.keys(UNIDADES)) {
        const opcion = document.createElement('option');
        opcion.value = unidad;
        opcion.textContent = nombreUnidad(unidad); // nombre completo; el valor interno no cambia
        select.appendChild(opcion);
      }
    }

    // Notificación en la esquina superior derecha que desaparece sola a los 3 s.
    // tipo: 'exito' (verde), 'info' (gris) o 'error' (rojo).
    const zonaToasts = document.getElementById('toasts');
    const DURACION_TOAST = 3000;
    function notificar(texto, tipo) {
      const toast = crearTexto('div', texto, 'toast toast-' + tipo);
      toast.setAttribute('role', tipo === 'error' ? 'alert' : 'status');
      zonaToasts.appendChild(toast);
      while (zonaToasts.children.length > 3) zonaToasts.firstChild.remove(); // máximo 3 a la vez
      setTimeout(() => toast.classList.add('saliendo'), DURACION_TOAST - 200); // se desvanece en 200 ms
      setTimeout(() => toast.remove(), DURACION_TOAST);
    }

    // Texto corto del toast rojo según los errores de validación.
    const ERROR_CORTO = { nombre: 'Falta el nombre', cantidad: 'Cantidad inválida', unidad: 'Falta la unidad', fecha: 'Fecha inválida' };
    function notificarErrores(errores) {
      const claves = Object.keys(errores);
      notificar(claves.length === 1 ? ERROR_CORTO[claves[0]] : 'Revisa los ' + claves.length + ' campos marcados', 'error');
    }

    /* ----- Formulario de Agregar (fijo, solo agrega) ----- */

    const form = document.getElementById('form-ingrediente');
    const alta = crearControlFormulario('campo');
    const campoNombre = alta.campos.nombre;

    form.addEventListener('submit', evento => {
      evento.preventDefault();
      const resultado = validarIngrediente(alta.leer(), despensa, false);
      if (!resultado.ok) {
        // Con errores no se guarda ni se limpia el formulario.
        alta.mostrarErrores(resultado.errores);
        notificarErrores(resultado.errores);
        return;
      }
      resaltarId = agregarIngrediente(despensa, resultado.datos).id; // nueva o la que se sumó
      const guardo = guardar();
      form.reset();
      alta.limpiarErrores();
      render();
      if (guardo) notificar('Ingrediente agregado', 'exito');
      campoNombre.focus();
    });

    /* ===================== Ventanas modales ===================== */

    // Pila de modales abiertos: Esc y Tab actúan sobre el de arriba.
    const modalesAbiertos = [];

    function abrirModal(modal, enfocar) {
      modal.focoAnterior = document.activeElement;
      modal.hidden = false;
      modalesAbiertos.push(modal);
      enfocar.focus();
    }

    function cerrarModal(modal) {
      if (modal.hidden) return;
      modal.hidden = true;
      const i = modalesAbiertos.indexOf(modal);
      if (i >= 0) modalesAbiertos.splice(i, 1);
      if (modal.focoAnterior && document.contains(modal.focoAnterior)) modal.focoAnterior.focus();
    }

    // Elementos que pueden recibir foco dentro de un modal (para que Tab no se salga).
    function enfocables(modal) {
      return [...modal.querySelectorAll('button, input, select, textarea')]
        .filter(el => !el.disabled && !el.hidden && el.offsetParent !== null);
    }

    document.addEventListener('keydown', e => {
      const modal = modalesAbiertos[modalesAbiertos.length - 1];
      if (!modal) return;
      if (e.key === 'Escape') {
        e.preventDefault();
        modal.cerrar();
        return;
      }
      if (e.key === 'Tab') {
        const lista = enfocables(modal);
        if (lista.length === 0) return;
        const i = lista.indexOf(document.activeElement);
        const siguiente = e.shiftKey ? (i <= 0 ? lista.length - 1 : i - 1) : (i === lista.length - 1 ? 0 : i + 1);
        e.preventDefault();
        lista[siguiente].focus();
      }
    });

    /* ----- Modal de Editar ----- */

    const modalEditar = document.getElementById('modal-editar');
    const formEditar = document.getElementById('form-editar');
    const edicion = crearControlFormulario('editar');
    let editandoId = null; // id del ingrediente abierto en el modal de edición

    function abrirEdicion(ing) {
      editandoId = ing.id;
      edicion.limpiarErrores();
      edicion.llenar(ing);
      render(); // marca la fila que se está editando (el botón Editar se vuelve a crear)
      abrirModal(modalEditar, edicion.campos.nombre);
      modalEditar.focoAnterior = null; // el foco de vuelta se maneja en cerrarEdicion
    }

    function cerrarEdicion() {
      const id = editandoId;
      editandoId = null;
      edicion.limpiarErrores();
      cerrarModal(modalEditar);
      render();
      // El foco vuelve al botón Editar de esa fila (o al formulario si ya no existe).
      const boton = document.querySelector('button[data-accion="editar"][data-id="' + id + '"]');
      (boton || campoNombre).focus();
    }
    modalEditar.cerrar = cerrarEdicion;

    formEditar.addEventListener('submit', evento => {
      evento.preventDefault();
      // Mismas validaciones que al agregar; al editar nunca se fusiona.
      const resultado = validarIngrediente(edicion.leer(), despensa, true);
      if (!resultado.ok) {
        edicion.mostrarErrores(resultado.errores); // errores dentro del modal, bajo cada campo
        notificarErrores(resultado.errores);
        return;
      }
      const ing = despensa.find(i => i.id === editandoId);
      if (ing) Object.assign(ing, resultado.datos);
      const guardo = guardar();
      resaltarId = editandoId;
      cerrarEdicion();
      if (guardo) notificar('Cambios guardados', 'exito');
    });

    document.getElementById('editar-cancelar').addEventListener('click', cerrarEdicion);
    document.getElementById('editar-cerrar').addEventListener('click', cerrarEdicion);
    // Clic fuera de la tarjeta (en el fondo oscuro) cierra el modal.
    modalEditar.addEventListener('click', e => { if (e.target === modalEditar) cerrarEdicion(); });

    /* ----- Modal de confirmación ----- */

    const confirmacion = document.getElementById('confirmacion');
    const textoConfirmacion = document.getElementById('texto-confirmacion');
    const botonConfirmarSi = document.getElementById('boton-confirmar-si');
    const botonConfirmarNo = document.getElementById('boton-confirmar-no');
    let alConfirmar = null; // acción pendiente

    // Muestra la confirmación; si la persona dice que sí, ejecuta "accion".
    function pedirConfirmacion(texto, textoBotonSi, accion) {
      textoConfirmacion.textContent = texto;
      botonConfirmarSi.textContent = textoBotonSi;
      alConfirmar = accion;
      abrirModal(confirmacion, botonConfirmarNo); // la opción segura queda enfocada
    }

    function cerrarConfirmacion() {
      alConfirmar = null;
      cerrarModal(confirmacion);
    }
    confirmacion.cerrar = cerrarConfirmacion;

    botonConfirmarSi.addEventListener('click', () => {
      const accion = alConfirmar;
      cerrarConfirmacion();
      if (accion) accion();
    });
    botonConfirmarNo.addEventListener('click', cerrarConfirmacion);
    confirmacion.addEventListener('click', e => { if (e.target === confirmacion) cerrarConfirmacion(); });

    /* ===================== Botones de las listas ===================== */

    // Editar / Eliminar (delegación de eventos).
    function alHacerClicEnLista(evento) {
      const boton = evento.target.closest('button[data-accion]');
      if (!boton) return;
      const ing = despensa.find(i => i.id === boton.dataset.id);
      if (!ing) return;

      if (boton.dataset.accion === 'eliminar') {
        pedirConfirmacion(
          '¿Eliminar "' + ing.nombre + '" (' + formatoCantidad(ing.cantidad, ing.unidad) + ')?',
          'Sí, eliminar',
          () => {
            despensa = despensa.filter(i => i.id !== ing.id);
            const guardo = guardar();
            render();
            if (guardo) notificar('Ingrediente eliminado', 'info');
            campoNombre.focus(); // el botón Eliminar ya no existe: el foco no se pierde
          });
      } else if (boton.dataset.accion === 'editar') {
        abrirEdicion(ing);
      }
    }
    listaDespensa.addEventListener('click', alHacerClicEnLista);
    listaVencidos.addEventListener('click', alHacerClicEnLista);

    // Restaurar la despensa de ejemplo (fechas relativas a hoy) y las recetas predefinidas.
    document.getElementById('boton-restaurar').addEventListener('click', () => {
      pedirConfirmacion(
        'Se borrarán todos tus ingredientes y se cargará la despensa de ejemplo. ¿Continuar?',
        'Sí, restaurar',
        () => {
          despensa = crearSemilla();
          recetas = RECETAS;
          aviso.hidden = true;          // se oculta ANTES de guardar: si guardar falla, su aviso queda visible
          const guardo = guardar();
          form.reset();
          alta.limpiarErrores();
          render();
          if (guardo) notificar('Datos de ejemplo restaurados', 'exito');
          campoNombre.focus();
        });
    });

    /* ===================== Inicio ===================== */

    llenarSelectorUnidades(alta.campos.unidad);
    llenarSelectorUnidades(edicion.campos.unidad);
    cargar();
    render();
  </script>
</body>
</html>
